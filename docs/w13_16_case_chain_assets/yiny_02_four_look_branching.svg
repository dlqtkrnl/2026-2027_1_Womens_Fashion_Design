<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><rect width="1800" height="1000" fill="#F7F3ED"/><rect x="24" y="24" width="1752" height="952" fill="#FCFAF7" stroke="#D8D0C6" stroke-width="2"/><rect x="66" y="58" width="176" height="62" fill="#2457D6"/><text x="154.0" y="99.8" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">展开</text><text x="268" y="105" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="700" fill="#2457D6" text-anchor="start">一条规则，四次分岔</text><text x="722.0" y="104" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#202124" text-anchor="start">每一次只改一个变量（逆向复原）</text><text x="68" y="158" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#66625D" text-anchor="start">四套之间不是四个想法，是同一条规则被检验了四次。常量维持识别，变量制造节奏——这正是第13周「首轮五款」页要求的关系。</text><rect x="66" y="200" width="356" height="590" fill="#111827"/><text x="92" y="262" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#60A5FA" text-anchor="start">BASE</text><text x="92" y="302" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">四套共用的常量</text><line x1="92" y1="326" x2="396" y2="326" stroke="#374151" stroke-width="2"/><text x="92" y="370" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="start">色域</text><text x="92" y="402" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#CBD5E1" text-anchor="start">灰白单色域，不靠颜色区分</text><text x="92" y="462" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="start">比例</text><text x="92" y="494" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#CBD5E1" text-anchor="start">纵向延伸的修长比例</text><text x="92" y="554" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#60A5FA" text-anchor="start">表层</text><text x="92" y="586" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#CBD5E1" text-anchor="start">半透明叠层＝格窗的影</text><rect x="92" y="652" width="304" height="114" fill="#1F2937"/><text x="110" y="688" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">变量只有一个方向：</text><text x="110" y="718" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#CBD5E1" text-anchor="start">面的分割 → 体积位置 →</text><text x="110" y="744" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#CBD5E1" text-anchor="start">支撑方式。逐级加大。</text><rect x="480" y="200" width="296" height="590" fill="#fff" stroke="#D8D0C6" stroke-width="2"/><rect x="480" y="200" width="296" height="6" fill="#2457D6"/><text x="500" y="254" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#C7C2BC" text-anchor="start">01</text><text x="550" y="253" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#202124" text-anchor="start">命题声明</text><line x1="500" y1="274" x2="756" y2="274" stroke="#D8D0C6" stroke-width="1.5"/><g transform="translate(528,290)"><path d="M 72 34 L 62 42 C 50 52 46 76 44 106 L 38 352 L 162 352 L 156 106 C 154 76 150 52 138 42 L 128 34 C 118 50 82 50 72 34 Z" fill="#fff" stroke="#202124" stroke-width="3" stroke-linejoin="round"/><line x1="93" y1="48" x2="89" y2="352" stroke="#202124" stroke-width="2"/><line x1="107" y1="48" x2="111" y2="352" stroke="#202124" stroke-width="2"/><path d="M 156 236 C 178 292 190 332 194 352 L 162 352 Z" fill="#fff" stroke="#202124" stroke-width="2.4" stroke-linejoin="round"/></g><text x="628.0" y="700" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#2457D6" text-anchor="middle">基准型</text><text x="628.0" y="728" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">直筒长身·前中通开</text><text x="500" y="758" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">整组的阅读入口。后面三套都以</text><text x="500" y="782" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">它为参照。</text><line x1="450" y1="500" x2="480" y2="500" stroke="#D8D0C6" stroke-width="1.6" stroke-dasharray="6 7"/><path d="M 460.0 492 L 471.0 500 L 460.0 508" fill="none" stroke="#9AA0A6" stroke-width="2.4"/><rect x="806" y="200" width="296" height="590" fill="#fff" stroke="#D8D0C6" stroke-width="2"/><rect x="806" y="200" width="296" height="6" fill="#C0392B"/><text x="826" y="254" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#C7C2BC" text-anchor="start">02</text><text x="876" y="253" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#202124" text-anchor="start">规则验证</text><line x1="826" y1="274" x2="1082" y2="274" stroke="#D8D