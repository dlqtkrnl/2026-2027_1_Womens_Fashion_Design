" y="254" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#C7C2BC" text-anchor="start">03</text><text x="1202" y="253" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#202124" text-anchor="start">品类转译</text><line x1="1152" y1="274" x2="1408" y2="274" stroke="#D8D0C6" stroke-width="1.5"/><g transform="translate(1180,290)"><path d="M 74 34 L 64 44 C 36 74 18 150 22 206 L 48 352 L 152 352 L 178 206 C 182 150 164 74 136 44 L 126 34 C 118 50 82 50 74 34 Z" fill="#fff" stroke="#202124" stroke-width="3" stroke-linejoin="round"/><line x1="100" y1="118" x2="100" y2="352" stroke="#202124" stroke-width="2.4"/><line x1="22" y1="206" x2="178" y2="206" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="8 8"/></g><text x="1280.0" y="700" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#C0392B" text-anchor="middle">变量：体积位置</text><text x="1280.0" y="728" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">体积移到中段</text><text x="1152" y="758" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">把体积从肩移到腰腹，成茧形。</text><text x="1152" y="782" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">识别度还剩多少？</text><line x1="1102" y1="500" x2="1132" y2="500" stroke="#D8D0C6" stroke-width="1.6" stroke-dasharray="6 7"/><path d="M 1112.0 492 L 1123.0 500 L 1112.0 508" fill="none" stroke="#9AA0A6" stroke-width="2.4"/><text x="1117.0" y="480" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#9AA0A6" text-anchor="middle">＋1</text><rect x="1458" y="200" width="296" height="590" fill="#fff" stroke="#D8D0C6" stroke-width="2"/><rect x="1458" y="200" width="296" height="6" fill="#C0392B"/><text x="1478" y="254" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#C7C2BC" text-anchor="start">04</text><text x="1528" y="253" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#202124" text-anchor="start">张力峰值</text><line x1="1478" y1="274" x2="1734" y2="274" stroke="#D8D0C6" stroke-width="1.5"/><g transform="translate(1506,290)"><path d="M 62 298 L 58 372 L 142 372 L 138 298 Z" fill="#fff" stroke="#202124" stroke-width="2.4" stroke-linejoin="round"/><path d="M 26 34 L 174 34 L 174 78 L 150 90 L 146 306 L 54 306 L 50 90 L 26 78 Z" fill="#fff" stroke="#202124" stroke-width="3" stroke-linejoin="round"/><line x1="26" y1="54" x2="174" y2="54" stroke="#C0392B" stroke-width="2.6"/><line x1="100" y1="90" x2="100" y2="306" stroke="#202124" stroke-width="2"/></g><text x="1606.0" y="700" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#C0392B" text-anchor="middle">变量：支撑方式</text><text x="1606.0" y="728" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#202124" text-anchor="middle">肩部结构支撑</text><text x="1478" y="758" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">用硬支撑把肩撑成方形，推到规</text><text x="1478" y="782" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">则的边界。</text><line x1="1428" y1="500" x2="1458" y2="500" stroke="#D8D0C6" stroke-width="1.6" stroke-dasharray="6 7"/><path d="M 1438.0 492 L 1449.0 500 L 1438.0 508" fill="none" stroke="#9AA0A6" stroke-width="2.4"/><text x="1443.0" y="480" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#9AA0A6" text-anchor="middle">＋1</text><rect x="66" y="818" width="1668" height="52" fill="#FFF9E8" stroke="#9A6B16" stroke-width="1.5" stroke-dasharray="9 7"/><text x="88" y="850" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#9A6B16" text-anchor="start">05 反证对照｜这一格是空的</text><text x="387.65" y="850" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#66625D" text-anchor="start">公开的毕业作品里没有「故意做错的那一套」。反证是你作业里才有的格子——把它混进前四套，同学挑不出来，就说明你的规则还没生效。</text><rect x="66" y="884" width="1668" height="46" fill="#FBF0EF" stroke="#C0392B" stroke-width="1.5"/><text x="84" y="914" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#C0392B" text-anchor="start">逆向复原图 · 非作者原始过程记录</text><text x="446.65" y="914" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" fill="#66625D" text-anchor="start">依据公开的主题板与最终四套成衣反向推定生成规则，用于课堂教学；作者本人的形态抽象与展开过程未公开，本图不代表其原始步骤。</text></svg>