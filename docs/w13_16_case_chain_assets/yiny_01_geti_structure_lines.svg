#66625D" text-anchor="start">去掉颜色、木质与题材，保留方向·比例·连接·留白</text><line x1="691" y1="322" x2="691" y2="498" stroke="#202124" stroke-width="3"/><line x1="763" y1="322" x2="763" y2="498" stroke="#202124" stroke-width="3"/><line x1="835" y1="322" x2="835" y2="498" stroke="#202124" stroke-width="3"/><text x="763" y="536" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#202124" text-anchor="middle">① 竖向分割的节奏</text><path d="M 993 336 L 1067 410 L 993 484 L 919 410 Z" fill="none" stroke="#202124" stroke-width="3"/><text x="993" y="536" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#202124" text-anchor="middle">② 可重复的菱形单元</text><rect x="691" y="576" width="132" height="104" fill="#2457D6" opacity="0.16" stroke="#2457D6" stroke-width="2"/><rect x="747" y="612" width="132" height="104" fill="#2457D6" opacity="0.16" stroke="#2457D6" stroke-width="2"/><rect x="747" y="612" width="76" height="68" fill="#2457D6" opacity="0.34"/><text x="917" y="638" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#2457D6" text-anchor="start">③ 偏移重叠</text><text x="917" y="672" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">两层错开，交叠处变深＝</text><text x="917" y="698" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#66625D" text-anchor="start">半透明层。</text><rect x="1224" y="196" width="510" height="594" fill="#fff" stroke="#D8D0C6" stroke-width="2"/><rect x="1224" y="196" width="510" height="6" fill="#1E7A5A"/><text x="1246" y="252" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#C7C2BC" text-anchor="start">03</text><text x="1302" y="251" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#202124" text-anchor="start">重组｜放到人体轴线上</text><text x="1248" y="288" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#66625D" text-anchor="start">同一组关系，改变尺度·位置·数量 → 结构不同的三个草图</text><line x1="1325.0" y1="312" x2="1325.0" y2="564" stroke="#C7C2BC" stroke-width="1.6" stroke-dasharray="9 9"/><path d="M 1297.0 334 L 1353.0 334 L 1367.0 378 L 1361.0 558 L 1289.0 558 L 1283.0 378 Z" fill="#fff" stroke="#202124" stroke-width="2.6" stroke-linejoin="round"/><path d="M 1325.0 372 L 1357.0 466 L 1325.0 552 L 1293.0 466 Z" fill="none" stroke="#1E7A5A" stroke-width="2.6"/><text x="1325.0" y="608" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#1E7A5A" text-anchor="middle">改尺度</text><text x="1325.0" y="636" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#66625D" text-anchor="middle">菱形放大覆盖前身</text><line x1="1479.0" y1="312" x2="1479.0" y2="564" stroke="#C7C2BC" stroke-width="1.6" stroke-dasharray="9 9"/><path d="M 1451.0 334 L 1507.0 334 L 1521.0 378 L 1515.0 558 L 1443.0 558 L 1437.0 378 Z" fill="#fff" stroke="#202124" stroke-width="2.6" stroke-linejoin="round"/><line x1="1455.0" y1="346" x2="1457.0" y2="552" stroke="#1E7A5A" stroke-width="2.8"/><line x1="1503.0" y1="346" x2="1501.0" y2="552" stroke="#1E7A5A" stroke-width="2.8"/><text x="1479.0" y="608" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#1E7A5A" text-anchor="middle">改位置</text><text x="1479.0" y="636" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#66625D" text-anchor="middle">分割移到左右两侧</text><line x1="1633.0" y1="312" x2="1633.0" y2="