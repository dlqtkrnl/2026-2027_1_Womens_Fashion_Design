<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#F4F3EF"/><rect x="22" y="22" width="1556" height="1156" fill="#FCFAF7" stroke="#DCD9D1" stroke-width="2"/><rect x="70" y="66" width="7" height="42" fill="#1B3A8F"/><text x="94" y="99" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#1B3A8F" text-anchor="start">物理边界</text><text x="70" y="172" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="900" fill="#131313" text-anchor="start">材料行为图</text><line x1="70" y1="200" x2="1530" y2="200" stroke="#131313" stroke-width="3"/><text x="70" y="240" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#6C737E" text-anchor="start">同一纸样换成不同材料后，体积、垂坠和伸缩都会改变。</text><text x="70" y="330" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="900" fill="#131313" text-anchor="start">同一纸样</text><path d="M 100 370 L 250 370 L 288 630 L 62 630 Z" fill="#fff" stroke="#131313" stroke-width="3.4"/><line x1="175" y1="370" x2="175" y2="630" stroke="#C6C3BA" stroke-width="2" stroke-dasharray="9 9"/><path d="M 150 370 L 175 450 L 200 370" fill="none" stroke="#1B3A8F" stroke-width="3"/><text x="92" y="670" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#6C737E" text-anchor="start">一个省道 · 一条中轴</text><line x1="332" y1="500" x2="414" y2="500" stroke="#6C737E" stroke-width="4"/><path d="M 414 500 L 395.7382211937538 508.1552090611914 L 395.7382211937538 491.8447909388086 Z" fill="#6C737E"/><path d="M 554.0 350 L 606.0 350 L 670.0 630 L 490.0 630 Z" fill="#fff" stroke="#131313" stroke-width="3.4" stroke-linejoin="round"/><line x1="580" y1="350" x2="580" y2="630" stroke="#C6C3BA" stroke-width="2" stroke-dasharray="8 8"/><text x="580" y="674" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#131313" text-anchor="middle">薄挺</text><text x="580" y="708" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="middle">欧根纱 / 塔夫绸</text><text x="580" y="742" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#3C424A" text-anchor="middle">体积撑得住，下摆离体</text><path d="M 854.0 350 L 906.0 350 L 950.8 600 L 809.2 600 Z" fill="#fff" stroke="#131313" stroke-width="3.4" stroke-linejoin="round"/><line x1="880" y1="350" x2="880" y2="600" stroke="#C6C3BA" stroke-width="2" stroke-dasharray="8 8"/><text x="880" y="674" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#131313" text-anchor="middle">厚重</text><text x="880" y="708" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="middle">羊毛 / 呢料</text><text x="880" y="742" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#3C424A" text-anchor="middle">垂直下落，体积靠重量</text><path d="M 1154.0 350 L 1206.0 350 L 1235.44 576 L 1124.56 576 Z" fill="#fff" stroke="#131313" stroke-width="3.4" stroke-linejoin="round"/><line x1="1180" y1="350" x2="1180" y2="576" stroke="#C6C3BA" stroke-width="2" stroke-dasharray="8 8"/><text x="1180" y="674" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#131313" text-anchor="middle">弹性</text><text x="1180" y="708" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="middle">针织 / 罗纹</text><text x="1180" y="742" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#3C424A" text-anchor="middle">贴身收窄，长度缩短</text><text x="70" y="784" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#6C737E" text-anchor="start">先测三项，再画廓形 —— 写数值，不写形容词</text><line x1="70" y1="800" x2="1530" y2="800" stroke="#131313" stroke-width="3"/><text x="70.0" y="850" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="900" fill="#131313" text-anchor="start">悬垂长度</text><text x="70.0" y="896" font-family="'IBM Plex Mono','Consolas',monospace" font-size="21" font-weight="400" fill="#6C737E" text-anchor="start">材料 1</text><line x1="190.0" y1="902" x2="370.0" y2="902" stroke="#C6C3BA" stroke-width="2"/><text x="384.0" y="896" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="start">cm</text><text x="70.0" y="948" font-family="'IBM Plex Mono','Consolas',monospace" font-size="21" font-weight="400" fill="#6C737E" text-anchor="start">材料 2</text><line x1="190.0" y1="954" x2="370.0" y2="954" stroke="#C6C3BA" stroke-width="2"/><text x="384.0" y="948" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="start">cm</text><text x="70.0" y="1000" font-family="'IBM Plex Mono','Consolas',monospace" font-size="21" font-weight="400" fill="#6C737E" text-anchor="start">材料 3</text><line x1="190.0" y1="1006" x2="370.0" y2="1006" stroke="#C6C3BA" stroke-width="2"/><text x="384.0" y="1000" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="start">cm</text><text x="556.6666666666667" y="850" font-family="'Noto Sans CJK SC','Source Han Sans SC',