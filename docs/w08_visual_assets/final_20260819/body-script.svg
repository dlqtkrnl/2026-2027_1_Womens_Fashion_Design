<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#F4F3EF"/><rect x="22" y="22" width="1556" height="1156" fill="#FCFAF7" stroke="#DCD9D1" stroke-width="2"/><rect x="70" y="66" width="7" height="42" fill="#1B3A8F"/><text x="94" y="99" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#1B3A8F" text-anchor="start">任务 B</text><text x="70" y="172" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="900" fill="#131313" text-anchor="start">平衡线坐标系</text><line x1="70" y1="200" x2="1530" y2="200" stroke="#131313" stroke-width="3"/><text x="70" y="240" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#6C737E" text-anchor="start">平衡线是穿在身体上的坐标系：上身之后仍应保持水平或垂直。</text><text x="250" y="324" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#1B3A8F" text-anchor="start">成立</text><path d="M 322.0 350 L 478.0 350 L 550.0 425.2 C 544.0 509.8 523.0 538.0 520.0 566.2 C 508.0 632.0 505.0 660.2 529.0 726.0 L 538.0 820 L 262.0 820 L 271.0 726.0 C 295.0 660.2 292.0 632.0 280.0 566.2 C 277.0 538.0 256.0 509.8 250.0 425.2 Z" fill="#fff" stroke="#131313" stroke-width="3.4" stroke-linejoin="round"/><line x1="272" y1="453.4" x2="528" y2="453.4" stroke="#1B3A8F" stroke-width="3.4"/><line x1="272" y1="566.2" x2="528" y2="566.2" stroke="#1B3A8F" stroke-width="3.4"/><line x1="272" y1="679.0" x2="528" y2="679.0" stroke="#1B3A8F" stroke-width="3.4"/><line x1="400.0" y1="368" x2="400.0" y2="804" stroke="#1B3A8F" stroke-width="3.4"/><line x1="496.0" y1="470" x2="496.0" y2="600" stroke="#131313" stroke-width="2.6"/><path d="M 496.0 470 l -7 16 l 14 0 Z" fill="#131313"/><text x="518" y="546" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="start">直丝绺</text><text x="250" y="874" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#3C424A" text-anchor="start">胸·腰·臀水平；前中垂直；直丝</text><text x="250" y="903" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#3C424A" text-anchor="start">绺不扭。</text><text x="970" y="324" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="900" fill="#A8232F" text-anchor="start">不成立</text><path d="M 1042.0 350 L 1198.0 350 L 1270.0 425.2 C 1264.0 509.8 1243.0 538.0 1240.0 566.2 C 1228.0 632.0 1225.0 660.2 1249.0 726.0 L 1258.0 820 L 982.0 820 L 991.0 726.0 C 1015.0 660.2 1012.0 632.0 1000.0 566.2 C 997.0 538.0 976.0 509.8 970.0 425.2 Z" fill="#fff" stroke="#131313" stroke-width="3.4" stroke-linejoin="round"/><line x1="992" y1="443.4" x2="1248" y2="463.4" stroke="#A8232F" stroke-width="3.4"/><line x1="992" y1="549.2" x2="1248" y2="583.2" stroke="#A8232F" stroke-width="3.4"/><line x1="992" y1="655.0" x2="1248" y2="703.0" stroke="#A8232F" stroke-width="3.4"/><line x1="1104.0" y1="368" x2="1142.0" y2="804" stroke="#A8232F" stroke-width="3.4"/><line x1="1230.0" y1="470" x2="1202.0" y2="600" stroke="#131313" stroke-width="2.6"/><path d="M 1230.0 470 l -7 16 l 14 0 Z" fill="#131313"/><text x="1238" y="546" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#6C737E" text-anchor="start">直丝绺</text><text x="970" y="874" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#3C424A" text-anchor="start">水平线前后翘 → 长度或体积不</text><text x="970" y="903" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#3C424A" text-anchor="start">足；前中偏向一侧 → 左右不对</text><text x="970" y="932" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#3C424A" text-anchor="start">称或侧缝拉扯。</text><line x1="800.0" y1="310" x2="800.0" y2="1010" stroke="#DCD9D1" stroke-width="2"/><text x="70" y="1024" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#131313" text-anchor="start">只在右侧插针，左侧留作原始对照 —— 确认后再对称修改纸样。</text><rect x="70" y="1068" width="1460" height="76" fill="#131313"/><text x="96" y="1102" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#F4F3EF" text-anchor="start">平衡线歪了，其余全部免谈。先把它调正，再看褶皱——顺序反了会白改一整轮。</text></svg>