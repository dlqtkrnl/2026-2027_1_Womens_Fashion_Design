<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#F4F3EF"/><rect x="22" y="22" width="1556" height="1156" fill="#FCFAF7" stroke="#DCD9D1" stroke-width="2"/><rect x="70" y="66" width="7" height="42" fill="#1B3A8F"/><text x="94" y="99" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#1B3A8F" text-anchor="start">结构阅读法</text><text x="70" y="172" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="900" fill="#131313" text-anchor="start">张力地图</text><line x1="70" y1="200" x2="1530" y2="200" stroke="#131313" stroke-width="3"/><text x="70" y="240" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#6C737E" text-anchor="start">褶皱是力的方向，不是表面装饰。先读方向，再回到纸样找原因。</text><path d="M 241.6 320 L 418.4 320 L 500.0 419.2 C 493.2 530.8 469.4 568.0 466.0 605.2 C 452.4 692.0 449.0 729.2 476.2 816.0 L 486.4 940 L 173.6 940 L 183.8 816.0 C 211.0 729.2 207.60000000000002 692.0 194.0 605.2 C 190.6 568.0 166.8 530.8 160.0 419.2 Z" fill="#fff" stroke="#131313" stroke-width="3.4" stroke-linejoin="round"/><path d="M 222 450 q 18.0 9 36.0 0 q 18.0 -9 36.0 0 q 18.0 9 36.0 0 q 18.0 -9 36.0 0 q 18.0 9 36.0 0 q 18.0 -9 36.0 0" fill="none" stroke="#131313" stroke-width="3"/><path d="M 222 484 q 18.0 9 36.0 0 q 18.0 -9 36.0 0 q 18.0 9 36.0 0 q 18.0 -9 36.0 0 q 18.0 9 36.0 0 q 18.0 -9 36.0 0" fill="none" stroke="#131313" stroke-width="3"/><path d="M 222 518 q 18.0 9 36.0 0 q 18.0 -9 36.0 0 q 18.0 9 36.0 0 q 18.0 -9 36.0 0 q 18.0 9 36.0 0 q 18.0 -9 36.0 0" fill="none" stroke="#131313" stroke-width="3"/><line x1="210" y1="484" x2="116" y2="484" stroke="#1B3A8F" stroke-width="4"/><path d="M 116 484 L 134.26177880624616 475.8447909388086 L 134.26177880624616 492.1552090611914 Z" fill="#1B3A8F"/><line x1="450" y1="484" x2="544" y2="484" stroke="#1B3A8F" stroke-width="4"/><path d="M 544 484 L 525.7382211937538 492.1552090611914 L 525.7382211937538 475.8447909388086 Z" fill="#1B3A8F"/><circle cx="580" cy="484" r="21" fill="#1B3A8F"/><text x="580" y="493" font-family="'IBM Plex Mono','Consolas',monospace" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">01</text><path d="M 268 604 C 259 666 277 720 268 778" fill="none" stroke="#131313" stroke-width="3"/><path d="M 330 604 C 321 666 339 720 330 778" fill="none" stroke="#131313" stroke-width="3"/><path d="M 392 604 C 383 666 401 720 392 778" fill="none" stroke="#131313" stroke-width="3"/><line x1="470" y1="670" x2="544" y2="724" stroke="#1B3A8F" stroke-width="4"/><path d="M 544 724 L 524.4410568870666 719.822950286981 L 534.0555438899479 706.6475421719214 Z" fill="#1B3A8F"/><circle cx="580" cy="754" r="21" fill="#1B3A8F"/><text x="580" y="763" font-family="'IBM Plex Mono','Consolas',monospace" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">02</text><line x1="232" y1="806" x2="314" y2="900" stroke="#131313" stroke-width="3"/><line x1="258" y1="806" x2="340" y2="900" stroke="#131313" stroke-width="3"/><line x1="284" y1="806" x2="366" y2="900" stroke="#131313" stroke-width="3"/><line x1="212" y1="842" x2="130" y2="908" stroke="#1B3A8F" stroke-width="4"/><path d="M 130 908 L 139.11274630091847 890.1966897781593 L 149.3395318665865 902.9026960870196 Z" fill="#1B3A8F"/><circle cx="94" cy="936" r="21" fill="#1B3A8F"/><text x="94" y="945" font-family="'IBM Plex Mono','Consolas',monospace" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">03</text><text x="690" y="302" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="800" fill="#6C737E" text-anchor="start">看见什么 → 原因是什么 → 动作是什么</text><line x1="690" y1="320" x2="1530" y2="320" stroke="#131313" stroke-width="3"/><text x="696" y="380" font-family="'IBM Plex Mono','Consolas',monospace" font-size="34" font-weight="700" fill="#1B3A8F" text-anchor="start">01</text><text x="776" y="380" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="900" fill="#131313" text-anchor="start">横向拉扯</text><text x="776" y="422" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#3C424A" text-anchor="start">原因　围度或活动松量不足</text><text x="776" y="462" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1B3A8F" text-anchor="start">动作　加围度。先量净围，再决定加在哪一片。</text><line x1="690" y1="492" x2="1530" y2="492" stroke="#DCD9D1" stroke-width="2"/><text x="696" y="576" font-family="'IBM Plex Mono','Consolas',monospace" font-size="34" font-weight="700" fill="#1B3A8F" text-anchor="start">02</text><text x="776" y="576" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="900" fill="#131313" text-anchor="start">纵向坠塌</text><text x="776" y="618" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#3C424A" text-anchor="start">原因　肩颈·腰部或内部支撑失效</text><text x="776" y="658" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1B3A8F" text-anchor="start">动作　补支撑：肩线、腰线或内部衬布——三者只改一处。</text><line x1="690" y1="688" x2="1530" y2="688" stroke="#DCD9D1" stroke-width="2"/><text x="696" y="772" font-family="'IBM Plex Mono','Consolas',monospace" font-size="34" font-weight="700" fill="#1B3A8F" text-anchor="start">03</text><text x="776" y="772" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="900" fill="#131313" text-anchor="start">斜向褶皱</text><text x="776" y="814" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#3C424A" text-anchor="start">原因　省道方向·长度或平衡线偏移</text><text x="776" y="854" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1B3A8F" text-anchor="start">动作　转移省量，不要直接剪掉。</text><line x1="690" y1="884" x2="1530" y2="884" stroke="#DCD9D1" stroke-width="2"/><rect x="70" y="1068" width="1460" height="76" fill="#131313"/><text x="96" y="1102" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#F4F3EF" text-anchor="start">在照片上画出褶皱方向，再沿反方向寻找纸样原因。方向说不出来，就还没读。</text></svg>